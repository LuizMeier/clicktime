[project]
name = "clicktime-mcp"
version = "0.1.0"
description = "MCP server for ClickTime time tracking — personal and manager workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27.1",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.5.1",
]

[project.scripts]
clicktime-mcp = "clicktime_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clicktime_mcp"]
